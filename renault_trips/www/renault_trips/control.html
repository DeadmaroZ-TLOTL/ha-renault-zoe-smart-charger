<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Renault ZOE</title>
  <link rel="stylesheet" href="./control-pages.css?v=1.2.12">
  <link rel="stylesheet" href="./shared-theme.css?v=2.3.2">
</head>
<body>
  <main class="app control-app">
    <header class="topbar">
      <div class="title-wrap">
        <div id="titleIcon" class="title-icon" aria-hidden="true"></div>
        <div>
          <h1 id="pageTitle">Renault ZOE</h1>
          <p id="pageSubtitle"></p>
        </div>
      </div>
      <div class="filters">
        <select id="period" aria-label="Vēstures periods">
          <option value="1">Šodiena (00–24)</option>
          <option value="3">3 kalendāra dienas</option>
          <option value="7">7 kalendāra dienas</option>
          <option value="14">14 kalendāra dienas</option>
          <option value="30">30 kalendāra dienas</option>
          <option value="current_month" selected>Tekošais mēnesis</option>
          <option value="90">90 kalendāra dienas</option>
          <option value="all">Visa pieejamā vēsture</option>
        </select>
        <span class="date-range-fields">
          <label class="date-range-field"><span data-range-label="start">No</span><input id="dayDate" type="date" aria-label="No datuma"></label>
          <label class="date-range-field"><span data-range-label="end">Līdz</span><input id="dayDateTo" type="date" aria-label="Līdz datumam"></label>
        </span>
        <button id="clearDate" class="icon-command" type="button" hidden title="Notīrīt datumu" aria-label="Notīrīt datumu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <a id="settings" class="icon-command settings-link" href="/config/integrations/integration/zoe_new_extended" target="_top" title="Iestatījumi" aria-label="Iestatījumi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.55a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.45 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.37.36.7.64.98.3.28.68.43 1.07.43H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </a>
        <a id="entitySettings" class="icon-command settings-link" href="/config/integrations/integration/zoe_new_extended" target="_top" hidden title="Entītiju avoti" aria-label="Entītiju avoti">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM4 15h16v4H4z"/><path d="M8 9v6M16 9v6"/></svg>
        </a>
        <button id="reload" class="primary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 1 0-2.37 5.73"/><path d="M20 4v7h-7"/></svg>
          <span id="reloadLabel">Atjaunot</span>
        </button>
      </div>
    </header>

    <div id="status" class="status">Ielādēju Home Assistant datus...</div>

    <section id="metrics" class="metrics" aria-label="Kopsavilkums"></section>

    <section id="actions" class="actions" aria-label="Komandas"></section>

    <section id="controlPanels" class="control-grid"></section>

    <section class="charts">
      <article class="panel chart-panel">
        <div class="panel-header">
          <div>
            <h2 id="mainChartTitle">Vēsture</h2>
            <span id="mainChartSubtitle"></span>
          </div>
          <div id="mainLegend" class="legend"></div>
        </div>
        <div class="chart-wrap">
          <canvas id="mainChart" role="img" aria-label="Vēstures grafiks"></canvas>
          <div id="mainTooltip" class="chart-tooltip" hidden></div>
        </div>
      </article>

      <article class="panel chart-panel">
        <div class="panel-header">
          <div>
            <h2 id="secondaryChartTitle">Detalizēta vēsture</h2>
            <span id="secondaryChartSubtitle"></span>
          </div>
          <div id="secondaryLegend" class="legend"></div>
        </div>
        <div class="chart-wrap">
          <canvas id="secondaryChart" role="img" aria-label="Detalizētas vēstures grafiks"></canvas>
          <div id="secondaryTooltip" class="chart-tooltip" hidden></div>
        </div>
      </article>
    </section>

    <section id="detailPanel" class="panel detail-panel">
      <div class="panel-header">
        <div>
          <h2 id="detailTitle">Datu vēsture</h2>
          <span id="detailSubtitle"></span>
        </div>
      </div>
      <div id="detailContent"></div>
    </section>
  </main>

  <script src="./dashboard-tabs.js?v=1.2.0"></script>
  <script src="./date-range.js?v=1.0.2"></script>
  <script src="./control-pages.js?v=1.3.4"></script>
</body>
</html>
